name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline guarantee
        run: ./scripts/check-no-network.sh
      - name: Test
        run: swift test
      - name: Build universal app
        run: RELEASE=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent macrecord.app macrecord.zip
          cd .. && ./scripts/make-dmg.sh && cd dist
          shasum -a 256 macrecord.zip macrecord.dmg | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/macrecord.zip dist/macrecord.dmg dist/SHA256SUMS --generate-notes

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Network allowlist
        run: ./scripts/check-windows-network.sh
      - name: Test core
        run: dotnet test windows/tests/Macrecord.Core.Tests/Macrecord.Core.Tests.csproj
      - name: Publish single-file exe
        run: |
          dotnet publish windows/src/Macrecord.Windows/Macrecord.Windows.csproj -c Release -r win-x64 \
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="${GITHUB_REF_NAME#v}" -o windows/dist
          cp windows/dist/macrecord.exe macrecord-windows-x64.exe
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" macrecord-windows-x64.exe
