name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Offline guarantee
        run: ./scripts/check-no-network.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/build-app.sh
